[project]
name = "eddy-pump"
version = "0.1.0"
description = "Water-mass injection events (submesoscale eddy-pump obduction/subduction) — the science application layer on argopod"
requires-python = ">=3.11"
dependencies = [
    # the generic detect -> review -> triage library, with the extras this repo's
    # workflow uses: [cli] (YAML config), [ml] (triage/catalogue), [review] (the
    # keyboard labelling app and its panels).
    #
    # argopod is not on PyPI, so the bare name resolves nowhere and the git tag is
    # named directly.  Replace this with a plain PyPI requirement
    # ("argopod[cli,ml,review]>=0.5.2") if and when argopod is published there.
    # Building against a local argopod checkout instead?  pip re-clones a direct
    # URL even when a matching argopod is already installed, so install
    # `../argopod[all,dev]` first and then this repo with --no-deps.
    "argopod[cli,ml,review] @ git+https://github.com/mkeutgen/argopod@v0.5.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",    # the cached residual grids are parquet
    # scipy and gsw are imported directly by the pipeline scripts and reach us
    # through no extra of argopod[cli,ml,review]: gsw lives in argopod[argo], and
    # scipy only ever arrived through scikit-learn.  Named here so an install
    # without those extras still runs the pipeline.
    "scipy>=1.11",
    "gsw>=3.6",
    "joblib>=1.3",     # classifier.save / load (arrives with scikit-learn, named to be honest)
]

[project.optional-dependencies]
argo = ["argopod[argo]"]              # argopy + gsw, only for fetching/rendering fresh floats
dev  = ["pytest>=8.0", "pytest-cov"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
