# config/events.yaml — the six event definitions of the net-carbon study. The one source.
#
# study:            the study id, the review criterion, the cache the saved candidate lists are
#                   bound to, where outputs go and where they must never go
# cache:            how the fleet cache is built: the four grid kinds and the channels each one
#                   carries, the dates kept, what happens to a placeholder value, which column a
#                   cycle falls back to, and the ceilings the cache check uses. The plausible
#                   ranges, the floats left out and the backscatter smoother are already written
#                   below (raw_inputs, excluded_floats, tracers.carbon.prefilter) and are joined to
#                   this block in code, so nothing is written down twice
# spec_version:     the version prefix of every spec_id
# params:           the one detector knob the study moved (the local-extremum test is off)
# directions:       the AOU sign per limb (negative = subduction, positive = obduction)
# physical:         the two channels every pool needs — AOU (1.50 σ, the limb's sign) and absolute
#                   salinity (1.50 σ, either sign), both with the shape check
# tracers:          the one channel a child pool adds — nitrate (1.00 σ, signed per limb) or
#                   backscatter (1.00 σ, positive, no shape check)
# raw_inputs:       the Argo variables the channels are derived from, their plausible ranges, and
#                   what the cache build does with a value outside them
# excluded_floats:  the nine floats left out of the cache, each with its reason
# pools:            the six pools, parent first on each limb, each with its recorded spec_id — a
#                   hash of the channels and parameters. The loader refuses a pool whose content no
#                   longer hashes to the id written here. Change one only on purpose: every label
#                   and every saved candidate list is keyed to it.
#
# A pool is written `<channel>/<direction>` here and in pool ids, and `<channel>_<direction>` in file
# names and EVENT_TYPE; they are the same pool.
#
# Read by eddy_pump.manifest.load_manifest(), which turns this file into the study object. Why the
# values are what they are — the decisions on plausible ranges, the nitrate ceiling, the excluded
# floats, the channel order, the cache identity — is in the archive (mkeutgen/eddy-pump-archive,
# docs/DECISIONS.md). Comments here say what a value is; they do not argue for it.

study:
  study_id: net_carbon_v1
  criterion_version: phys_net_carbon_v1
  cache_identity: data/candidates/net_carbon_v1/CACHE_IDENTITY.json
  output_root: results/net_carbon_v1
  forbidden_output_roots:
    - results/obduction     # a retired output tree the active study must never write into
    - results/scan          # a retired read-only cache the active study must never write into

cache:
  grid_kinds:             # grid kind -> the channels that grid carries, in this order
    paper_phys: [AOU, ABS_SAL, SIGMA0]
    paper_bbp:  [AOU, ABS_SAL, BBP700_ADJUSTED, SIGMA0]
    paper_nit:  [AOU, ABS_SAL, NITRATE_ADJUSTED, SIGMA0]
    paper_all:  [AOU, ABS_SAL, NITRATE_ADJUSTED, BBP700_ADJUSTED, SIGMA0]
  window:                 # the profile dates kept, both ends included
    since: 2009-01-08
    until: 2026-03-15
  fill_policy: mask       # a placeholder value becomes "no reading" before anything is derived from it
  adjusted_fallback: cycle  # a cycle with no delayed-mode column reads the raw one, that cycle only
  residual_ceilings:      # the largest scaled residual the cache check accepts; null = reported, not checked
    AOU: 1000
    ABS_SAL: 1000
    NITRATE_ADJUSTED: 1000
    SIGMA0: 1000
    BBP700_ADJUSTED: null

spec_version: v1

params:
  extremum_ratio_threshold: 0.0

directions:
  subduction:
    aou_sign: negative
    physical_parent: physical/subduction
  obduction:
    aou_sign: positive
    physical_parent: physical/obduction

physical:
  aou:
    name: AOU
    cutoff: 1.50
    require_gradient_check: true
    prefilter:
      valid_range: [-600.0, 600.0]
      range_policy: mask
  shared:
    - {name: ABS_SAL, cutoff: 1.50, require_gradient_check: true}

tracers:
  nitrate:
    channel: NITRATE_ADJUSTED
    cutoff: 1.00
    require_gradient_check: true
    sign_constraint:
      obduction: positive   # old deep water is nutrient-rich (Redfield remineralisation)
      subduction: negative  # young surface water is nutrient-poor
    prefilter:
      valid_range: [0.0, 48.0]
      range_policy: clip
      range_tolerance: 2.0
  carbon:
    channel: BBP700_ADJUSTED
    cutoff: 1.00
    require_gradient_check: false
    sign_constraint:
      obduction: positive   # a particle excess is the carbon signature on both limbs
      subduction: positive
    prefilter:
      pre_median_filter: true
      valid_range: [0.0, 0.1]
      range_policy: clip
      range_tolerance: 0.005

raw_inputs:
  - name: DOXY_ADJUSTED
    valid_range: [0.0, 600.0]
    range_policy: clip
    range_tolerance: 3.0
  - name: PSAL_ADJUSTED
    valid_range: [1.0, 41.0]
    range_policy: mask
  - name: TEMP_ADJUSTED
    valid_range: [-2.5, 40.0]
    range_policy: mask

excluded_floats:
  # One sentence of why, then where the full case is written down. The evidence behind every line
  # here -- the depth-banded statistics, the co-located floats, the candidate counts -- is in the
  # archive, mkeutgen/eddy-pump-archive, docs/DECISIONS.md, the entries of 2026-08-25.
  - wmo: 6903872
    ruled: 2026-08-25
    ruled_by: user
    reason: >-
      Salinity that breaks intermittently: the spread is 2.3 to 2.4 g/kg in every depth band, against
      0.12 on a healthy float, so a plausible range removes the levels that cross it and certifies
      the wrong ones that do not.
    evidence: "eddy-pump-archive, docs/DECISIONS.md, 2026-08-25."
  - wmo: 6902963
    ruled: 2026-08-25
    ruled_by: user
    reason: >-
      The same broken salinity off Peru, with 87,231 levels stuck in a band no ocean reaches, and a
      range would leave 458,430 levels that read plausibly and cannot be trusted.
    evidence: "eddy-pump-archive, docs/DECISIONS.md, 2026-08-25."
  - wmo: 2902882
    ruled: 2026-08-25
    ruled_by: user
    reason: >-
      Its whole nitrate record sits above the ocean, 45.52 and higher where six neighbouring floats
      read 5.57 to 43.52, and the profile shape is textbook, so no detector can see it.
    evidence: "eddy-pump-archive, docs/DECISIONS.md, 2026-08-25."
  - wmo: 2902914
    ruled: 2026-08-25
    ruled_by: user
    reason: >-
      Nitrate about 25 umol/kg above four neighbouring floats on every density surface, a shift so
      even that a ceiling of 48 leaves 95,901 wrong levels untouched.
    evidence: "eddy-pump-archive, docs/DECISIONS.md, 2026-08-25."
  - wmo: 4902679
    ruled: 2026-08-25
    ruled_by: user
    reason: >-
      One of four Line P floats that never got a delayed-mode nitrate correction, reading 4.3 to 5.7
      umol/kg above six corrected neighbours, where a ceiling of 48 would build a false plateau.
    evidence: "eddy-pump-archive, docs/DECISIONS.md, 2026-08-25."
  - wmo: 4902680
    ruled: 2026-08-25
    ruled_by: user
    reason: >-
      The second uncorrected Line P float, 3.5 to 4.5 umol/kg above the corrected neighbours on every
      density surface, and a ceiling of 48 masks none of it.
    evidence: "eddy-pump-archive, docs/DECISIONS.md, 2026-08-25."
  - wmo: 4902681
    ruled: 2026-08-25
    ruled_by: user
    reason: >-
      The third uncorrected Line P float, about 2.1 umol/kg high everywhere, which no ceiling can
      reach because its whole record stops at 46.96.
    evidence: "eddy-pump-archive, docs/DECISIONS.md, 2026-08-25."
  - wmo: 4902683
    ruled: 2026-08-25
    ruled_by: user
    reason: >-
      The worst of the four uncorrected Line P floats, 7.1 to 8.5 umol/kg high, so its shallow water
      already reads above the deep maximum of the corrected neighbours.
    evidence: "eddy-pump-archive, docs/DECISIONS.md, 2026-08-25."
  - wmo: 1902692
    ruled: 2026-08-25
    ruled_by: user
    reason: >-
      An offset sensor in the eastern tropical North Pacific, 3 umol/kg high on the very surface
      whose real nitrate maximum the ceiling of 48 was set to protect, and it also reports -23.25.
    evidence: "eddy-pump-archive, docs/DECISIONS.md, 2026-08-25."

pools:
  - channel: physical
    direction: obduction
    spec_id: "v1:31619ba88c252ed8"   # a hash of this pool's channels and parameters; the loader refuses a mismatch
  - channel: nitrate
    direction: obduction
    spec_id: "v1:7762b146690be98e"
  - channel: carbon
    direction: obduction
    spec_id: "v1:feb637c336821f05"
  - channel: physical
    direction: subduction
    spec_id: "v1:6b8de00d7d53e118"
  - channel: nitrate
    direction: subduction
    spec_id: "v1:4d000b93251473f9"
  - channel: carbon
    direction: subduction
    spec_id: "v1:768ee191d3cfcd9f"
