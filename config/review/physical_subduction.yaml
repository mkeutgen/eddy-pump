# How the review app draws a panel for the downward limb (physical subduction).
# See physical_obduction.yaml for what every key means. The one difference is the AOU sign: a
# subduction event is a negative AOU anomaly — young, oxygen-rich water pushed down — beside a
# salinity anomaly of either sign. That is clause 1 of phys_net_carbon_v1 with the limb's sign.

event: paper_phys
title: "physical subduction — net_carbon_v1 (AOU negative)"

variables:
  - {name: AOU, cutoff: 1.50, sign_constraint: negative, require_gradient_check: true}
  - {name: ABS_SAL, cutoff: 1.50, require_gradient_check: true}

params:
  extremum_ratio_threshold: 0.0

panel:
  - {name: AOU, cutoff: 1.50, label: "AOU (μmol/kg) — subduction: NEGATIVE bulge"}
  - {name: ABS_SAL, cutoff: 1.50, label: "Abs. Salinity (g/kg)"}

paths:
  candidates: ../../results/net_carbon_v1/candidates/physical_subduction.parquet
