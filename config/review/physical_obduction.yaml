# How the review app draws a panel for the upward limb (physical obduction).
#
# `event: paper_phys` is the grid kind in the bound fleet cache ({wmo}_paper_phys_*.parquet), so
# argopod picks exactly that grid and never falls back to another one. The cache path is not
# written here; the make rule puts it in the environment:
#
#   make review BATCH=results/net_carbon_v1/labeling/rate_obduction_01/rate_obduction_01.csv
#
# which exports ARGOPOD_RESIDUAL_CACHE from data/candidates/net_carbon_v1/CACHE_IDENTITY.json.
#
# The panel is part of the criterion. `phys_net_carbon_v1` (config/criteria.yaml) shows the two
# physical channels of a physical pool — AOU and absolute salinity — with the profile, the
# pressure-space residual and the density row when the sidecar exists.
#
# `paths.candidates` exists only so argopod has a worksheet directory to fall back on; every batch
# of this study is passed explicitly with --batch and lives under results/net_carbon_v1/labeling/.

event: paper_phys
title: "physical obduction — net_carbon_v1 (AOU positive)"

variables:
  - {name: AOU, cutoff: 1.50, sign_constraint: positive, require_gradient_check: true}
  - {name: ABS_SAL, cutoff: 1.50, require_gradient_check: true}

params:
  extremum_ratio_threshold: 0.0

panel:
  - {name: AOU, cutoff: 1.50, label: "AOU (μmol/kg) — obduction: POSITIVE bulge"}
  - {name: ABS_SAL, cutoff: 1.50, label: "Abs. Salinity (g/kg)"}

paths:
  candidates: ../../results/net_carbon_v1/candidates/physical_obduction.parquet
